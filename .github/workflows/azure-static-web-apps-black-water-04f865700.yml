name: Azure Static Web Apps CI/CD
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Verify and deploy portal + API
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_disposable_postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify API against isolated PostgreSQL
        run: |
          mkdir -p .local
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('.local/pg-ci.json',JSON.stringify({PORTAL_PG_HOST:'127.0.0.1',PORTAL_PG_PORT:'5432',PORTAL_PG_DATABASE:'postgres',PORTAL_PG_USER:'postgres',PORTAL_PG_PASSWORD:'ci_only_disposable_postgres',PORTAL_PG_ALLOW_LOCAL:'true'}));
          JS
          ARKS_TEST_PG_CONFIG="$GITHUB_WORKSPACE/.local/pg-ci.json" npm test
      - run: npm run build:azure
      - run: npm run azure:verify
      - run: npm ci --omit=dev --prefix api
      - name: Deploy frontend and managed Functions API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WATER_04F865700 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/client
          api_location: api
          output_location: ''
          skip_app_build: true
          skip_api_build: true
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_WATER_04F865700 }}
          action: close
